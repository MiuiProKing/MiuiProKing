name: Fixed Supabase feed checks
on:
  push:
    branches: [main, fixed-supabase-20261010]
    paths: ['fixed.html', 'fixed-cloud.js', 'tests/fixed-cloud.test.cjs', '.github/workflows/fixed-cloud-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/fixed-cloud.test.cjs
      - run: node tests/fixed-cloud-read.cjs
